name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trading/xyz_lighter_arb/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading/xyz_lighter_arb/requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: |
          python -m compileall -q trading backtest

      - name: Run pytest when tests exist
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) \
            ! -path './trading/xyz_lighter_arb/test_ctp_connection.py' | grep -q .; then
            pytest -q --ignore=trading/xyz_lighter_arb/test_ctp_connection.py
          else
            echo "No automated pytest suite found."
          fi
